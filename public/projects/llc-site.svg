<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <rect width="600" height="300" rx="8" fill="#F3EFF5"/>
  <!-- Terracotta pot -->
  <path d="M 240 220 L 245 260 L 355 260 L 360 220 Z" fill="#C44569" opacity="0.7"/>
  <rect x="230" y="210" width="140" height="16" rx="3" fill="#C44569" opacity="0.85"/>
  <path d="M 250 260 L 255 275 L 345 275 L 350 260 Z" fill="#C44569" opacity="0.55"/>
  <!-- Soil -->
  <ellipse cx="300" cy="215" rx="58" ry="6" fill="#8B6F5E" opacity="0.4"/>
  <!-- Main stem -->
  <line x1="300" y1="210" x2="300" y2="120" stroke="#3D8B5E" stroke-width="5" stroke-linecap="round"/>
  <!-- Jade leaves - thick oval succulent leaves -->
  <!-- Top cluster -->
  <ellipse cx="300" cy="100" rx="18" ry="12" fill="#5DAE7E" transform="rotate(-10 300 100)"/>
  <ellipse cx="285" cy="108" rx="16" ry="10" fill="#4A9E6E" transform="rotate(20 285 108)"/>
  <ellipse cx="318" cy="105" rx="16" ry="10" fill="#4A9E6E" transform="rotate(-25 318 105)"/>
  <ellipse cx="300" cy="85" rx="14" ry="10" fill="#6BBF8E"/>
  <!-- Left branch -->
  <line x1="295" y1="155" x2="255" y2="125" stroke="#3D8B5E" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="245" cy="115" rx="16" ry="11" fill="#5DAE7E" transform="rotate(30 245 115)"/>
  <ellipse cx="240" cy="128" rx="14" ry="10" fill="#4A9E6E" transform="rotate(15 240 128)"/>
  <ellipse cx="258" cy="110" rx="12" ry="9" fill="#6BBF8E" transform="rotate(-10 258 110)"/>
  <!-- Right branch -->
  <line x1="305" y1="160" x2="345" y2="130" stroke="#3D8B5E" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="355" cy="120" rx="16" ry="11" fill="#5DAE7E" transform="rotate(-30 355 120)"/>
  <ellipse cx="360" cy="133" rx="14" ry="10" fill="#4A9E6E" transform="rotate(-15 360 133)"/>
  <ellipse cx="342" cy="115" rx="12" ry="9" fill="#6BBF8E" transform="rotate(10 342 115)"/>
  <!-- Small lower leaves on main stem -->
  <ellipse cx="290" cy="175" rx="12" ry="8" fill="#4A9E6E" transform="rotate(25 290 175)"/>
  <ellipse cx="312" cy="180" rx="12" ry="8" fill="#5DAE7E" transform="rotate(-20 312 180)"/>
  <!-- Leaf highlights -->
  <ellipse cx="300" cy="96" rx="6" ry="4" fill="#8DDAA8" opacity="0.5"/>
  <ellipse cx="247" cy="113" rx="5" ry="3" fill="#8DDAA8" opacity="0.4"/>
  <ellipse cx="353" cy="118" rx="5" ry="3" fill="#8DDAA8" opacity="0.4"/>
</svg>
