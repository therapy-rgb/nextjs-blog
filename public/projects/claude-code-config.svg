<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <rect width="600" height="300" rx="8" fill="#F3EFF5"/>
  <!-- Terminal window -->
  <rect x="100" y="40" width="400" height="220" rx="12" fill="#1D3557"/>
  <!-- Title bar -->
  <rect x="100" y="40" width="400" height="32" rx="12" fill="#2A4A73"/>
  <rect x="100" y="60" width="400" height="12" fill="#2A4A73"/>
  <!-- Window dots -->
  <circle cx="125" cy="56" r="5" fill="#C44569" opacity="0.8"/>
  <circle cx="143" cy="56" r="5" fill="#D4A843" opacity="0.8"/>
  <circle cx="161" cy="56" r="5" fill="#2EC4B6" opacity="0.8"/>
  <!-- Terminal content -->
  <!-- Prompt line 1 -->
  <text x="125" y="105" font-family="monospace" font-size="14" fill="#2EC4B6" opacity="0.9">$</text>
  <text x="140" y="105" font-family="monospace" font-size="14" fill="#E8E0EC"> claude</text>
  <!-- Output line -->
  <text x="125" y="130" font-family="monospace" font-size="13" fill="#E8E0EC" opacity="0.6">&#x276F; Initializing Claude Code...</text>
  <!-- Prompt line 2 -->
  <text x="125" y="160" font-family="monospace" font-size="13" fill="#2EC4B6" opacity="0.7">&#x2713;</text>
  <text x="140" y="160" font-family="monospace" font-size="13" fill="#E8E0EC" opacity="0.6"> CLAUDE.md loaded</text>
  <!-- Prompt line 3 -->
  <text x="125" y="185" font-family="monospace" font-size="13" fill="#2EC4B6" opacity="0.7">&#x2713;</text>
  <text x="140" y="185" font-family="monospace" font-size="13" fill="#E8E0EC" opacity="0.6"> hooks configured</text>
  <!-- Cursor line -->
  <text x="125" y="215" font-family="monospace" font-size="14" fill="#2EC4B6" opacity="0.9">$</text>
  <rect x="140" y="204" width="9" height="15" fill="#2EC4B6" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
